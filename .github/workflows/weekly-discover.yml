name: Weekly VST Discovery

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run discovery script
        run: python scripts/discover.py

      - name: Commit updates
        run: |
          git config user.name "VST Atlas Bot"
          git config user.email "bot@vstatlas.local"
          git add data/plugins.json web/data/plugins.json
          git diff --staged --quiet || git commit -m "chore: weekly plugin discovery update"
          git push
